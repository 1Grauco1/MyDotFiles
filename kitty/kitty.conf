include ./colors.conf

font_family      JetBrains Mono Nerd Font Mono
font_size        13
disable_ligatures no
enable_audio_bell no

shell fish
shell_integration disabled
cursor_shape block

url_style curly

# Detach the browser from kitty's process tree so Hyprland window
# swallowing doesn't replace the terminal when clicking links
open_url_with setsid -f xdg-open

map ctrl+shift+equal change_font_size all +2.0
map ctrl+shift+minus change_font_size all -2.0
map ctrl+shift+0 change_font_size all 0

# Transparência
background_opacity 0.92
dynamic_background_opacity yes
background_blur 10

# Scrollback
scrollback_lines -1

# Comportamento
mouse_reporting yes
map_ctrl_c_to_copy yes
map_ctrl_v_to_paste yes

allow_remote_control yes
term xterm-256color

# Window
remember_window_size no
initial_window_width 78c
initial_window_height 23c
window_padding_width 25
hide_window_decorations yes
confirm_os_window_close 0

scroll_handle_opacity 0
scroll_track_opacity 0
scroll_track_hover_opacity 0
scrollbar_width 0

# Binds

map ctrl+shift+enter new_window
map ctrl+shift+w close_window

map ctrl+shift+h neighboring_window left
map ctrl+shift+l neighboring_window right
map ctrl+shift+k neighboring_window up
map ctrl+shift+j neighboring_window down

map ctrl+shift+space next_layout

